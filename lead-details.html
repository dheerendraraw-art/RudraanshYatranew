<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lead Details - Rudraansh Yatra Portal</title>
    <link rel="icon" type="image/png" href="assets/images/logo.png">
    <link rel="shortcut icon" type="image/png" href="assets/images/logo.png">

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        :root {
            --bg-base: #080d16;
            --bg-card: #111827;
            --bg-card-alt: #162032;
            --bg-input: #0a0f1d;
            --border: #1f293d;
            --border-bright: #2d3d5c;
            --border-gold: rgba(212, 175, 55, 0.3);
            --gold: #d4af37;
            --gold-hover: #e5be48;
            --gold-dim: rgba(212, 175, 55, 0.12);
            --text-main: #f3f4f6;
            --text-sub: #9ca3af;
            --text-muted: #6b7280;
            --green: #10b981;
            --green-dim: rgba(16, 185, 129, 0.12);
            --blue: #3b82f6;
            --blue-dim: rgba(59, 130, 246, 0.12);
            --amber: #f59e0b;
            --amber-dim: rgba(245, 158, 11, 0.12);
            --red: #ef4444;
            --red-dim: rgba(239, 68, 68, 0.12);
            --radius: 10px;
            --transition: all 0.18s ease;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Top Header Navigation */
        .top-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px 18px;
            margin-bottom: 20px;
            gap: 16px;
        }
        .nav-left { display: flex; align-items: center; gap: 14px; min-width: 0; }
        .back-link {
            display: inline-flex; align-items: center; gap: 6px;
            color: var(--text-sub); text-decoration: none; font-size: 13px; font-weight: 600;
            padding: 6px 12px; border-radius: 6px; background: rgba(255,255,255,0.04);
            border: 1px solid var(--border); transition: var(--transition); flex-shrink: 0;
        }
        .back-link:hover { color: #fff; background: rgba(255,255,255,0.08); }
        .nav-title { font-size: 18px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .nav-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

        .status-pill {
            padding: 4px 12px; border-radius: 50px; font-size: 11px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.5px;
            background: var(--gold-dim); color: var(--gold); border: 1px solid var(--border-gold);
        }

        .btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 8px 14px; border-radius: 7px; font-size: 12.5px; font-weight: 600;
            cursor: pointer; border: 1px solid transparent; text-decoration: none;
            transition: var(--transition); font-family: inherit;
        }
        .btn-call { background: var(--green-dim); color: var(--green); border-color: rgba(16,185,129,0.25); }
        .btn-call:hover { background: var(--green); color: #000; }
        .btn-reminder { background: var(--amber-dim); color: var(--amber); border-color: rgba(245,158,11,0.25); }
        .btn-reminder:hover { background: var(--amber); color: #000; }
        .btn-gold { background: var(--gold); color: #000; font-weight: 700; }
        .btn-gold:hover { background: var(--gold-hover); }

        /* Layout Grid */
        .layout-grid {
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 20px;
            align-items: start;
        }

        /* Card Component */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            margin-bottom: 20px;
        }
        .card:last-child { margin-bottom: 0; }
        .card-header {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
            font-size: 12px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.8px; color: var(--text-sub);
            display: flex; align-items: center; justify-content: space-between;
        }
        .card-body { padding: 18px; }

        /* Lead Profile Header */
        .profile-box { text-align: center; padding: 22px 18px 18px; }
        .avatar-circle {
            width: 60px; height: 60px; border-radius: 50%;
            background: #1e293d; color: var(--gold); border: 2px solid var(--border-gold);
            font-size: 22px; font-weight: 700; display: flex; align-items: center; justify-content: center;
            margin: 0 auto 12px;
        }
        .profile-name { font-size: 18px; font-weight: 700; color: #fff; margin-bottom: 4px; }
        .profile-meta { font-size: 12px; color: var(--text-sub); }

        .quick-actions {
            display: flex; gap: 8px; margin-top: 14px; justify-content: center;
        }
        .chip-btn {
            padding: 6px 12px; border-radius: 6px; font-size: 11.5px; font-weight: 600;
            text-decoration: none; display: inline-flex; align-items: center; gap: 5px;
            transition: var(--transition);
        }
        .chip-phone { background: var(--green-dim); color: var(--green); border: 1px solid rgba(16,185,129,0.2); }
        .chip-phone:hover { background: var(--green); color: #000; }
        .chip-wa { background: rgba(37,211,102,0.12); color: #25d366; border: 1px solid rgba(37,211,102,0.2); }
        .chip-wa:hover { background: #25d366; color: #000; }

        /* Form Fields */
        .form-group { margin-bottom: 14px; }
        .form-group:last-child { margin-bottom: 0; }
        .form-label {
            display: block; font-size: 11px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.5px; color: var(--text-sub); margin-bottom: 6px;
        }
        .form-control {
            width: 100%; background: var(--bg-input); border: 1px solid var(--border);
            color: var(--text-main); border-radius: 7px; padding: 9px 12px; font-size: 13px;
            outline: none; transition: var(--transition); font-family: inherit;
        }
        .form-control:focus { border-color: var(--gold); }
        .form-static {
            background: rgba(255,255,255,0.02); border: 1px solid var(--border);
            padding: 9px 12px; border-radius: 7px; font-size: 13px; color: var(--text-sub);
        }

        .btn-full {
            width: 100%; background: var(--gold); color: #000; border: none;
            padding: 11px; font-size: 13px; font-weight: 700; border-radius: 7px;
            cursor: pointer; transition: var(--transition); font-family: inherit; margin-top: 6px;
        }
        .btn-full:hover { background: var(--gold-hover); }

        /* Right Column Components */
        .note-box {
            width: 100%; background: var(--bg-input); border: 1px solid var(--border);
            color: var(--text-main); border-radius: 8px; padding: 12px; font-size: 13px;
            resize: vertical; min-height: 90px; outline: none; font-family: inherit;
            margin-bottom: 12px;
        }
        .note-box:focus { border-color: var(--gold); }

        /* Timeline */
        .timeline { display: flex; flex-direction: column; gap: 12px; }
        .timeline-item {
            background: var(--bg-card-alt); border: 1px solid var(--border);
            border-radius: 8px; padding: 12px 14px; display: flex; align-items: flex-start; gap: 12px;
        }
        .timeline-icon {
            width: 32px; height: 32px; border-radius: 6px; display: flex; align-items: center;
            justify-content: center; font-size: 13px; flex-shrink: 0;
        }
        .timeline-body { flex: 1; min-width: 0; }
        .timeline-text { font-size: 13px; font-weight: 500; color: var(--text-main); margin-bottom: 3px; word-break: break-word; }
        .timeline-time { font-size: 11px; color: var(--text-muted); }
        .timeline-badge {
            font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 4px; flex-shrink: 0;
        }

        /* Tags */
        .tags-wrap { display: flex; flex-wrap: wrap; gap: 6px; }
        .tag-item {
            font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 50px;
            background: rgba(255,255,255,0.05); color: var(--text-sub); border: 1px solid var(--border);
        }
        .tag-item.gold { background: var(--gold-dim); color: var(--gold); border-color: var(--border-gold); }
        .tag-item.green { background: var(--green-dim); color: var(--green); }
        .tag-item.blue { background: var(--blue-dim); color: var(--blue); }

        /* Toast */
        #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
        .toast {
            background: #1e293b; color: #fff; border-left: 3px solid var(--gold);
            padding: 10px 16px; border-radius: 6px; font-size: 13px; font-weight: 500;
            box-shadow: 0 4px 16px rgba(0,0,0,0.4); animation: fadeIn 0.2s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Modal */
        .modal-overlay {
            display: none; position: fixed; inset: 0; z-index: 10000;
            align-items: center; justify-content: center; background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
        }
        .modal-box {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 12px; width: 90%; max-width: 440px; padding: 22px;
        }
        .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
        .modal-close { background: none; border: none; color: var(--text-sub); font-size: 18px; cursor: pointer; }

        /* Mobile Adjustments */
        .mob-action-bar { display: none; }
        @media (max-width: 860px) {
            .layout-grid { grid-template-columns: 1fr; }
            .container { padding: 12px 12px 80px; }
            .top-nav { flex-direction: column; align-items: flex-start; gap: 10px; }
            .nav-right { width: 100%; justify-content: space-between; }
            .btn .btn-text { display: none; }
            .mob-action-bar {
                display: flex; position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
                background: #0f172a; border-top: 1px solid var(--border); padding: 10px 14px; gap: 8px;
            }
            .mob-btn { flex: 1; padding: 10px; text-align: center; border-radius: 6px; font-size: 12px; font-weight: 700; text-decoration: none; border: none; }
            .mob-btn-call { background: var(--green-dim); color: var(--green); }
            .mob-btn-remind { background: var(--amber-dim); color: var(--amber); }
            .mob-btn-save { background: var(--gold); color: #000; }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Top Navigation Bar -->
        <div class="top-nav">
            <div class="nav-left">
                <a href="admin.html" class="back-link">
                    <i class="fa-solid fa-arrow-left"></i> Dashboard
                </a>
                <h1 class="nav-title" id="lead-page-title">Lead Details</h1>
            </div>
            <div class="nav-right">
                <a id="header-call-btn" href="#" class="btn btn-call" onclick="logCallInitiated()">
                    <i class="fa-solid fa-phone"></i><span class="btn-text"> Call</span>
                </a>
                <button type="button" onclick="openLeadReminderModal()" class="btn btn-reminder">
                    <i class="fa-solid fa-bell"></i><span class="btn-text"> Reminder</span>
                </button>
                <button type="button" onclick="saveAllLeadProperties()" class="btn btn-gold">
                    <i class="fa-solid fa-floppy-disk"></i><span class="btn-text"> Save</span>
                </button>
                <span class="status-pill" id="header-status-badge">New</span>
            </div>
        </div>

        <!-- Main Layout Grid -->
        <div class="layout-grid">

            <!-- Left Column: Overview & Properties -->
            <div>

                <!-- Lead Profile Card -->
                <div class="card">
                    <div class="profile-box">
                        <div class="avatar-circle" id="lead-avatar-initials">Y</div>
                        <div class="profile-name" id="lead-display-name">Loading...</div>
                        <div class="profile-meta" id="lead-display-source">Website Lead</div>
                        <div class="quick-actions">
                            <span id="lead-call-wrapper"></span>
                            <span id="lead-wa-wrapper"></span>
                        </div>
                    </div>
                </div>

                <!-- Properties Card -->
                <div class="card">
                    <div class="card-header">
                        <span>Lead Details &amp; Options</span>
                        <i class="fa-solid fa-sliders"></i>
                    </div>
                    <div class="card-body">
                        <div class="form-group admin-only-field" style="display:none;">
                            <label class="form-label">Client Name</label>
                            <input type="text" id="property-name" class="form-control" placeholder="Full name">
                        </div>
                        <div class="form-group admin-only-field" style="display:none;">
                            <label class="form-label">Phone Number</label>
                            <input type="text" id="property-phone" class="form-control" placeholder="+91 XXXXX XXXXX">
                        </div>
                        <div class="form-group admin-only-field" style="display:none;">
                            <label class="form-label">Email Address</label>
                            <input type="email" id="property-email" class="form-control" placeholder="email@example.com">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Contact Phone</label>
                            <div class="form-static" id="lead-display-phone">&mdash;</div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Contact Email</label>
                            <div class="form-static" id="lead-display-email">&mdash;</div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Lead Status</label>
                            <select id="property-status" class="form-control">
                                <option value="New">✨ New</option>
                                <option value="Answered">📞 Answered</option>
                                <option value="Busy">⏳ Busy</option>
                                <option value="Incorrect Number">🚫 Incorrect Number</option>
                                <option value="Follow up required">🔁 Follow up required</option>
                                <option value="Not Answered">🔇 Not Answered</option>
                                <option value="No. not reachable">📴 No. not reachable</option>
                            </select>
                        </div>
                        <div class="form-group" id="prop-assignee-row">
                            <label class="form-label">Assigned To Staff</label>
                            <select id="property-assignee" class="form-control">
                                <option value="">Loading...</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Travel Date</label>
                            <input type="date" id="property-travel-date" class="form-control">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Final Status</label>
                            <select id="property-final-status" class="form-control">
                                <option value="">🔘 None</option>
                                <option value="Booking confirmed">🎉 Booking confirmed</option>
                                <option value="Booked elsewhere">🏢 Booked elsewhere</option>
                                <option value="Postpone">⏳ Postpone</option>
                                <option value="Lost lead">🗑️ Lost lead</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">No. of Travelers</label>
                            <input type="number" id="property-travelers" class="form-control" min="1" placeholder="1">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Created At</label>
                            <div class="form-static" id="property-created-at">&mdash;</div>
                        </div>

                        <button type="button" id="btn-save-lead-properties" onclick="saveAllLeadProperties()" class="btn-full">
                            <i class="fa-solid fa-floppy-disk"></i> Save Lead Changes
                        </button>
                    </div>
                </div>

                <!-- Quick Tags -->
                <div class="card">
                    <div class="card-header">Information Badges</div>
                    <div class="card-body">
                        <div class="tags-wrap" id="lead-tags-container">
                            <span class="tag-item gold">Active Lead</span>
                        </div>
                    </div>
                </div>

            </div>

            <!-- Right Column: Add Note & Activity History -->
            <div>

                <!-- Add Note Card -->
                <div class="card">
                    <div class="card-header">
                        <span>Add Note / Remark</span>
                        <i class="fa-solid fa-pen"></i>
                    </div>
                    <div class="card-body">
                        <form id="new-note-form" onsubmit="submitNote(event)">
                            <textarea id="note-text" class="note-box" placeholder="Type a follow-up remark, note, or client feedback..." required></textarea>
                            <div style="display:flex; justify-content:space-between; align-items:center;">
                                <span style="font-size:11px; color:var(--text-muted);">Saves directly to timeline</span>
                                <button type="submit" class="btn btn-gold submit-note-btn">
                                    <i class="fa-solid fa-paper-plane"></i> Save Note
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Timeline / Activity Feed Card -->
                <div class="card">
                    <div class="card-header">
                        <span>Activity Feed &amp; Timeline</span>
                        <span id="history-count-badge" style="font-size:11px; opacity:0.8;">&mdash;</span>
                    </div>
                    <div class="card-body">
                        <div class="timeline" id="lead-timeline">
                            <div style="text-align:center; padding:24px; color:var(--text-muted); font-size:13px;">
                                Loading activity history...
                            </div>
                        </div>
                    </div>
                </div>

            </div>

        </div>

    </div>

    <!-- Mobile Action Bar -->
    <div class="mob-action-bar">
        <a id="mob-call-btn" href="#" class="mob-btn mob-btn-call" onclick="logCallInitiated()">Call</a>
        <button type="button" onclick="openLeadReminderModal()" class="mob-btn mob-btn-remind">Reminder</button>
        <button type="button" onclick="saveAllLeadProperties()" class="mob-btn mob-btn-save">Save</button>
    </div>

    <!-- Toast Notifications -->
    <div id="toast-container"></div>

    <!-- Follow Up Reminder Modal -->
    <div id="lead-reminder-modal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-title">
                <span>Set Follow-up Reminder</span>
                <button type="button" class="modal-close" onclick="closeLeadReminderModal()">&times;</button>
            </div>
            <form onsubmit="submitLeadReminderForm(event)">
                <div class="form-group">
                    <label class="form-label">Reminder Note</label>
                    <input type="text" id="lead-reminder-note" class="form-control" required>
                </div>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                    <div class="form-group">
                        <label class="form-label">Due Date</label>
                        <input type="date" id="lead-reminder-due-date" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Due Time</label>
                        <input type="time" id="lead-reminder-due-time" class="form-control" required>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Priority</label>
                    <select id="lead-reminder-priority" class="form-control">
                        <option value="Normal">Normal</option>
                        <option value="High">🔥 High</option>
                        <option value="Low">Low</option>
                    </select>
                </div>
                <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:16px;">
                    <button type="button" class="btn" style="background:rgba(255,255,255,0.05); color:var(--text-sub);" onclick="closeLeadReminderModal()">Cancel</button>
                    <button type="submit" class="btn btn-gold">Set Reminder</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Supabase JS & Script Logic -->
    <script>
        const adminToken = localStorage.getItem('admin_token');
        const adminVerified = localStorage.getItem('admin_verified');
        const currentUserRole = localStorage.getItem('admin_role') || 'staff';
        const currentUsername = localStorage.getItem('admin_username') || 'staff';
        const currentUserUuidMapping = localStorage.getItem('admin_uuid_mapping');

        if (!adminToken || adminVerified !== 'true') {
            window.location.href = 'admin.html';
        }

        async function fetchWithAuth(url, options = {}) {
            const token = localStorage.getItem('admin_token');
            const headers = {
                'Content-Type': 'application/json',
                ...options.headers
            };
            if (token) {
                headers['Authorization'] = `Bearer ${token}`;
            }
            if (options.body instanceof FormData) {
                delete headers['Content-Type'];
            }
            const response = await fetch(url, { ...options, headers });
            if (response.status === 401) {
                window.location.href = 'admin.html';
                throw new Error('Session expired. Please log in again.');
            }
            if (response.status === 403) {
                throw new Error('Permission denied.');
            }
            return response;
        }

        class SupabaseQueryBuilder {
            constructor(tableName) {
                this.table = tableName;
                this.operation = 'select';
                this.body = null;
                this.filters = [];
                this.orderBy = null;
                this.isSingle = false;
                this.limitVal = null;
            }
            select(fields) {
                if (this.operation !== 'insert' && this.operation !== 'update') {
                    this.operation = 'select';
                }
                return this;
            }
            insert(data) {
                this.operation = 'insert';
                this.body = data;
                return this;
            }
            update(data) {
                this.operation = 'update';
                this.body = data;
                return this;
            }
            delete() {
                this.operation = 'delete';
                return this;
            }
            eq(field, value) {
                this.filters.push({ type: 'eq', field, value });
                return this;
            }
            or(filterStr) {
                this.filters.push({ type: 'or', value: filterStr });
                return this;
            }
            order(field, options) {
                this.orderBy = { field, ascending: options?.ascending !== false };
                return this;
            }
            single() {
                this.isSingle = true;
                return this;
            }
            limit(num) {
                this.limitVal = num;
                return this;
            }
            then(onfulfilled, onrejected) {
                return this.execute().then(onfulfilled, onrejected);
            }
            async execute() {
                let url = '';
                let method = 'GET';
                let requestBody = null;
                
                let base = '';
                if (this.table === 'bookings') base = '/api/admin/bookings';
                else if (this.table === 'leads') base = '/api/admin/leads';
                else if (this.table === 'custom_requests') base = '/api/admin/custom-requests';
                else if (this.table === 'discount_registrations') base = '/api/admin/discount-registrations';
                else if (this.table === 'blogs') base = '/api/admin/blogs';
                else if (this.table === 'gallery') base = '/api/admin/gallery';
                else if (this.table === 'staff_credentials') base = '/api/admin/credentials';
                else if (this.table === 'users_view') base = '/api/admin/users';
                else if (this.table === 'booking_bills') base = '/api/billing';
                else if (this.table === 'lead_history') base = '/api/admin/leads-history';
                else if (this.table === 'reminders') base = '/api/admin/reminders';
                
                const idFilter = this.filters.find(f => f.field === 'id' && f.type === 'eq');
                const idVal = idFilter ? idFilter.value : null;
                
                if (this.operation === 'select') {
                    method = 'GET';
                    url = base;
                    if (this.isSingle && this.table === 'leads' && idVal) {
                        url = `${base}/${idVal}`;
                    }
                } else if (this.operation === 'insert') {
                    method = 'POST';
                    url = base;
                    requestBody = this.body;
                } else if (this.operation === 'update') {
                    method = 'PUT';
                    if (idVal) {
                        url = `${base}/${idVal}`;
                    } else {
                        url = base;
                    }
                    requestBody = this.body;
                } else if (this.operation === 'delete') {
                    method = 'DELETE';
                    if (idVal) {
                        url = `${base}/${idVal}`;
                    } else {
                        url = base;
                    }
                }
                
                try {
                    const fetchOptions = { method };
                    if (requestBody) {
                        fetchOptions.body = JSON.stringify(requestBody);
                    }
                    
                    const response = await fetchWithAuth(url, fetchOptions);
                    const responseData = await response.json();
                    
                    if (!response.ok) {
                        return { data: null, error: { message: responseData.error || 'API Request Failed' } };
                    }
                    
                    let resultData = responseData;
                    if (Array.isArray(resultData)) {
                        this.filters.forEach(filter => {
                            if (filter.type === 'eq') {
                                resultData = resultData.filter(item => {
                                    const itemVal = item[filter.field];
                                    if (itemVal === undefined) return true;
                                    if (itemVal === null || filter.value === null) return itemVal === filter.value;
                                    return itemVal.toString() === filter.value.toString();
                                });
                            }
                        });
                    }
                    if (this.isSingle && Array.isArray(resultData)) {
                        resultData = resultData[0] || null;
                    } else if (this.limitVal !== null && Array.isArray(resultData)) {
                        resultData = resultData.slice(0, this.limitVal);
                    }
                    
                    return {
                        data: resultData,
                        error: null,
                        select: () => ({
                            single: () => ({ data: resultData, error: null })
                        })
                    };
                } catch (err) {
                    console.error(`API error on ${method} ${url}:`, err);
                    return { data: null, error: err };
                }
            }
        }

        const supabaseAdmin = {
            from: (table) => new SupabaseQueryBuilder(table)
        };

        const urlParams = new URLSearchParams(window.location.search);
        const leadId = urlParams.get('id');

        if (!leadId) {
            alert('No lead ID specified!');
            window.location.href = 'admin.html';
        }

        let leadData = null;
        let uuidToUsernameMap = {};

        // Toast Notification Helper
        function showToast(message, type = 'default') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            if (type === 'success') toast.style.borderLeftColor = 'var(--green)';
            if (type === 'error') toast.style.borderLeftColor = 'var(--red)';
            toast.innerText = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Fetch Lead Details
        async function fetchLeadDetails() {
            try {
                const { data, error } = await supabaseAdmin
                    .from('leads')
                    .select('*')
                    .eq('id', leadId)
                    .single();

                if (error || !data) throw error || new Error('Lead not found');

                leadData = data;
                renderLeadDetails();
                fetchLeadHistory();
            } catch (err) {
                console.error(err);
                showToast('Failed to load lead details: ' + err.message, 'error');
            }
        }

        // Render details to UI elements
        function renderLeadDetails() {
            if (!leadData) return;

            document.getElementById('header-status-badge').innerText = leadData.status || 'New';
            document.getElementById('lead-display-name').innerText = leadData.name || 'Anonymous';
            document.getElementById('lead-page-title').innerText = `${leadData.name || 'Lead'} — Details`;

            // Avatar Initials
            let initials = 'Y';
            if (leadData.name) {
                const parts = leadData.name.trim().split(' ');
                initials = parts.length > 1 ? (parts[0][0] + parts[1][0]).toUpperCase() : parts[0].slice(0, 2).toUpperCase();
            }
            document.getElementById('lead-avatar-initials').innerText = initials;

            document.getElementById('lead-display-phone').innerText = leadData.phone || 'N/A';
            document.getElementById('lead-display-email').innerText = leadData.email || 'N/A';
            document.getElementById('lead-display-source').innerText = leadData.source ? `Source: ${leadData.source}` : 'Website Lead';

            // Call & WhatsApp quick chips
            if (leadData.phone) {
                const cleanPhone = leadData.phone.replace(/[^0-9+]/g, '');
                const telPhone = cleanPhone.startsWith('+') ? cleanPhone : '+91' + cleanPhone.replace(/^91/, '');
                document.getElementById('lead-call-wrapper').innerHTML = `
                    <a href="tel:${telPhone}" class="chip-btn chip-phone" onclick="logCallInitiated()">
                        <i class="fa-solid fa-phone"></i> Call
                    </a>
                `;
                const waPhone = cleanPhone.replace(/^\+/, '');
                document.getElementById('lead-wa-wrapper').innerHTML = `
                    <a href="https://wa.me/${waPhone}" target="_blank" class="chip-btn chip-wa">
                        <i class="fa-brands fa-whatsapp"></i> WhatsApp
                    </a>
                `;
                document.getElementById('header-call-btn').href = `tel:${telPhone}`;
                document.getElementById('mob-call-btn').href = `tel:${telPhone}`;
            }

            // Editable inputs
            document.getElementById('property-status').value = leadData.status || 'New';
            if (leadData.assigned_to) {
                document.getElementById('property-assignee').value = leadData.assigned_to;
            }
            document.getElementById('property-travel-date').value = leadData.travel_date || '';
            document.getElementById('property-final-status').value = leadData.final_status || '';
            document.getElementById('property-travelers').value = leadData.travelers || 1;

            if (leadData.created_at) {
                const dateObj = new Date(leadData.created_at);
                document.getElementById('property-created-at').innerText = dateObj.toLocaleString('en-IN', {
                    dateStyle: 'medium', timeStyle: 'short'
                });
            }

            // Admin fields
            if (currentUserRole === 'admin') {
                document.querySelectorAll('.admin-only-field').forEach(el => el.style.display = 'block');
                document.getElementById('property-name').value = leadData.name || '';
                document.getElementById('property-phone').value = leadData.phone || '';
                document.getElementById('property-email').value = leadData.email || '';
            } else {
                document.querySelectorAll('.admin-only-field').forEach(el => el.style.display = 'none');
            }

            // Tags
            const tagsWrap = document.getElementById('lead-tags-container');
            let tagsHtml = `<span class="tag-item gold">${leadData.source || 'Website'}</span>`;
            if (leadData.final_status) {
                tagsHtml += `<span class="tag-item green">${leadData.final_status}</span>`;
            } else {
                tagsHtml += `<span class="tag-item">Active Lead</span>`;
            }
            if (leadData.travelers && leadData.travelers > 1) {
                tagsHtml += `<span class="tag-item blue">${leadData.travelers} Travelers</span>`;
            }
            tagsWrap.innerHTML = tagsHtml;
        }

        // Fetch Timeline History
        async function fetchLeadHistory() {
            try {
                const { data, error } = await supabaseAdmin
                    .from('lead_history')
                    .select('*')
                    .eq('lead_id', leadId)
                    .order('created_at', { ascending: false });

                if (error) throw error;

                const timeline = document.getElementById('lead-timeline');
                const badge = document.getElementById('history-count-badge');
                if (badge) badge.innerText = `${data ? data.length : 0} logs`;

                if (!data || data.length === 0) {
                    timeline.innerHTML = '<div style="text-align:center; padding:20px; color:var(--text-muted); font-size:13px;">No history records found for this lead.</div>';
                    return;
                }

                let html = '';
                data.forEach(item => {
                    const timeStr = new Date(item.created_at).toLocaleString('en-IN', {
                        dateStyle: 'medium', timeStyle: 'short'
                    });

                    let iconClass = 'fa-solid fa-clock-rotate-left';
                    let badgeText = 'System';
                    let color = '#9ca3af';
                    let iconBg = 'rgba(156,163,175,0.12)';
                    let badgeBg = 'rgba(156,163,175,0.12)';

                    if (item.action.includes('Transferred')) {
                        iconClass = 'fa-solid fa-share-nodes'; badgeText = 'Transfer';
                        color = 'var(--gold)'; iconBg = 'var(--gold-dim)'; badgeBg = 'var(--gold-dim)';
                    } else if (item.action.includes('Status')) {
                        iconClass = 'fa-solid fa-tags'; badgeText = 'Status';
                        color = 'var(--blue)'; iconBg = 'var(--blue-dim)'; badgeBg = 'var(--blue-dim)';
                    } else if (item.action.includes('Note by') || item.action.includes('Remarks')) {
                        iconClass = 'fa-solid fa-comment-dots'; badgeText = 'Note';
                        color = 'var(--green)'; iconBg = 'var(--green-dim)'; badgeBg = 'var(--green-dim)';
                    } else if (item.action.includes('reminder') || item.action.includes('Reminder')) {
                        iconClass = 'fa-solid fa-bell'; badgeText = 'Reminder';
                        color = 'var(--amber)'; iconBg = 'var(--amber-dim)'; badgeBg = 'var(--amber-dim)';
                    } else if (item.action.includes('call') || item.action.includes('Call')) {
                        iconClass = 'fa-solid fa-phone'; badgeText = 'Call';
                        color = 'var(--green)'; iconBg = 'var(--green-dim)'; badgeBg = 'var(--green-dim)';
                    }

                    html += `
                        <div class="timeline-item">
                            <div class="timeline-icon" style="background:${iconBg}; color:${color};">
                                <i class="${iconClass}"></i>
                            </div>
                            <div class="timeline-body">
                                <div class="timeline-text">${item.action}</div>
                                <div class="timeline-time">${timeStr}</div>
                            </div>
                            <span class="timeline-badge" style="background:${badgeBg}; color:${color};">${badgeText}</span>
                        </div>
                    `;
                });

                timeline.innerHTML = html;
            } catch (err) {
                console.error(err);
                document.getElementById('lead-timeline').innerHTML = '<div style="color:var(--red); padding:12px; font-size:13px;">Failed to load activity logs.</div>';
            }
        }

        // Add Quick Note
        async function submitNote(event) {
            event.preventDefault();
            const textEl = document.getElementById('note-text');
            const noteText = textEl.value.trim();
            if (!noteText) return;

            const btn = event.target.querySelector('.submit-note-btn');
            const origHtml = btn ? btn.innerHTML : '';
            if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving...'; }

            try {
                const actionDesc = `✍️ Note by ${currentUsername.charAt(0).toUpperCase() + currentUsername.slice(1)}: "${noteText}"`;
                const { error } = await supabaseAdmin.from('lead_history').insert([{ lead_id: leadId, action: actionDesc }]);
                if (error) throw error;

                let updatedRemarks = noteText;
                if (leadData && leadData.remarks && leadData.remarks.trim()) {
                    updatedRemarks = leadData.remarks.trim() + "\n" + noteText;
                }
                await supabaseAdmin.from('leads').update({ remarks: updatedRemarks }).eq('id', leadId);

                textEl.value = '';
                showToast('Note saved to timeline.', 'success');
                await fetchLeadDetails();
            } catch (err) {
                console.error(err);
                showToast('Failed to add note.', 'error');
            } finally {
                if (btn) { btn.disabled = false; btn.innerHTML = origHtml; }
            }
        }

        // Save all changes made in the form
        async function saveAllLeadProperties() {
            if (!leadData || !leadId) return;

            const btn = document.getElementById('btn-save-lead-properties');
            const originalText = btn ? btn.innerHTML : '';
            if (btn) {
                btn.disabled = true;
                btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving...';
            }

            try {
                const newStatus = document.getElementById('property-status').value;
                const newAssignee = document.getElementById('property-assignee').value;
                const newTravelDate = document.getElementById('property-travel-date').value;
                const newFinalStatus = document.getElementById('property-final-status').value;
                const newTravelers = parseInt(document.getElementById('property-travelers').value) || 1;

                const updateData = {
                    status: newStatus || 'New',
                    assigned_to: newAssignee || null,
                    travel_date: newTravelDate || null,
                    final_status: newFinalStatus || null,
                    travelers: newTravelers
                };

                if (currentUserRole === 'admin') {
                    const newName = document.getElementById('property-name').value.trim();
                    const newPhone = document.getElementById('property-phone').value.trim();
                    const newEmail = document.getElementById('property-email').value.trim();
                    if (newName) updateData.name = newName;
                    if (newPhone) updateData.phone = newPhone;
                    if (newEmail) updateData.email = newEmail;
                }

                const oldStatus = leadData.status || 'New';
                const statusChanged = (oldStatus !== newStatus);
                const oldFinalStatus = leadData.final_status || '';
                const finalStatusChanged = (oldFinalStatus !== newFinalStatus);

                const { error } = await supabaseAdmin
                    .from('leads')
                    .update(updateData)
                    .eq('id', leadId);

                if (error) throw error;

                if (statusChanged) {
                    await supabaseAdmin
                        .from('lead_history')
                        .insert([{
                            lead_id: leadId,
                            action: `🏷️ Status updated from "${oldStatus}" to "${newStatus}" by ${currentUsername}`
                        }]);
                }

                if (finalStatusChanged && newFinalStatus) {
                    await supabaseAdmin
                        .from('lead_history')
                        .insert([{
                            lead_id: leadId,
                            action: `🏁 Final Status set to "${newFinalStatus}" by ${currentUsername}`
                        }]);
                }

                if (newFinalStatus === 'Booking confirmed' && oldFinalStatus !== 'Booking confirmed') {
                    await copyLeadToBooking({ ...leadData, ...updateData, id: leadId });
                } else if (oldFinalStatus === 'Booking confirmed' && newFinalStatus !== 'Booking confirmed') {
                    await supabaseAdmin.from('bookings').delete().eq('lead_id', leadId);
                }

                showToast('Lead changes saved successfully!', 'success');
                await fetchLeadDetails();
            } catch (err) {
                console.error(err);
                showToast('Failed to save: ' + err.message, 'error');
            } finally {
                if (btn) {
                    btn.disabled = false;
                    btn.innerHTML = originalText;
                }
            }
        }

        // Call Helpers
        async function logCallInitiated() {
            if (!leadData) return;
            try {
                const clientName = leadData.name || 'Client';
                const actionDesc = `📞 Phone call initiated to ${clientName} (${leadData.phone || 'Phone'}) by ${currentUsername}`;
                await supabaseAdmin
                    .from('lead_history')
                    .insert([{ lead_id: leadId, action: actionDesc }]);
                showToast('Call action logged to timeline.');
                fetchLeadHistory();
            } catch (err) {
                console.error('Call logging failed:', err);
            }
        }

        // Copy lead to booking
        async function copyLeadToBooking(lead) {
            try {
                const { data: existing, error: checkErr } = await supabaseAdmin
                    .from('bookings')
                    .select('id')
                    .eq('lead_id', lead.id)
                    .limit(1);
                
                if (checkErr) throw checkErr;
                if (existing && existing.length > 0) {
                    showToast('Booking already exists for this lead.');
                    return;
                }

                let combinedNotes = lead.notes || '';
                if (lead.remarks) combinedNotes += (combinedNotes ? '\n\nRemarks: ' : '') + lead.remarks;

                const namePrefix = (lead.name || 'CUST').replace(/[^a-zA-Z]/g, '').slice(0, 3).toUpperCase() || 'RY';
                const randomNum = Math.floor(100 + Math.random() * 899);
                const autoBookingId = `RY-2026-${namePrefix}-${randomNum}`;
                const staffUuid = currentUserUuidMapping || lead.assigned_to || null;

                const { error: insertErr } = await supabaseAdmin
                    .from('bookings')
                    .insert([{
                        booking_id: autoBookingId,
                        name: lead.name,
                        phone: lead.phone,
                        email: lead.email || '',
                        package_name: 'Confirmed Lead Booking',
                        travel_date: lead.travel_date || new Date().toISOString().split('T')[0],
                        travelers: '1',
                        message: combinedNotes || 'Transferred from Leads Manager',
                        assigned_to: staffUuid,
                        user_id: staffUuid,
                        lead_id: lead.id
                    }]);

                if (insertErr) throw insertErr;
                showToast('Booking record automatically created!');
            } catch (err) {
                console.error('Failed to copy lead to bookings:', err);
            }
        }

        // Fetch Staff
        async function fetchAssignees() {
            try {
                const { data: staffData } = await supabaseAdmin
                    .from('staff_credentials')
                    .select('username, uuid_mapping');
                
                if (staffData) {
                    staffData.forEach(s => {
                        if (s.uuid_mapping) {
                            const name = s.username.charAt(0).toUpperCase() + s.username.slice(1);
                            uuidToUsernameMap[s.uuid_mapping.toLowerCase()] = name;
                        }
                    });
                }

                const { data: usersData } = await supabaseAdmin.from('users_view').select('*');
                const selectEl = document.getElementById('property-assignee');
                let optionsHtml = '<option value="">Unassigned</option>';
                
                if (usersData) {
                    usersData.forEach(user => {
                        const mappedName = uuidToUsernameMap[user.id.toLowerCase()];
                        const displayName = mappedName ? mappedName : user.email;
                        optionsHtml += `<option value="${user.id}">${displayName}</option>`;
                    });
                }
                selectEl.innerHTML = optionsHtml;
            } catch (err) {
                console.error('Failed to load assignees:', err);
            }
        }

        // Reminder Modal
        function openLeadReminderModal() {
            const modal = document.getElementById('lead-reminder-modal');
            if (!modal) return;
            document.getElementById('lead-reminder-note').value = `Follow up call with ${leadData ? (leadData.name || 'client') : 'client'}`;
            document.getElementById('lead-reminder-due-date').value = new Date().toISOString().split('T')[0];
            document.getElementById('lead-reminder-due-time').value = '10:00';
            modal.style.display = 'flex';
        }

        function closeLeadReminderModal() {
            const modal = document.getElementById('lead-reminder-modal');
            if (modal) modal.style.display = 'none';
        }

        async function submitLeadReminderForm(event) {
            event.preventDefault();
            if (!leadData || !leadId) return;

            const note = document.getElementById('lead-reminder-note').value.trim();
            const dueDate = document.getElementById('lead-reminder-due-date').value;
            const dueTime = document.getElementById('lead-reminder-due-time').value || '10:00';
            const priority = document.getElementById('lead-reminder-priority').value;

            try {
                const payload = {
                    lead_id: leadId,
                    lead_name: leadData.name || 'Client',
                    lead_phone: leadData.phone || '',
                    note,
                    due_date: dueDate,
                    due_time: dueTime,
                    priority,
                    assigned_to: leadData.assigned_to || null,
                    status: 'Pending'
                };

                const { error } = await supabaseAdmin.from('reminders').insert([payload]);
                if (error) throw error;

                showToast('Follow-up reminder set!', 'success');
                closeLeadReminderModal();
                fetchLeadHistory();
            } catch (err) {
                console.error(err);
                showToast('Failed to set reminder: ' + err.message, 'error');
            }
        }

        // Init
        async function initPage() {
            await fetchAssignees();
            await fetchLeadDetails();

            if (currentUserRole === 'staff') {
                const selectEl = document.getElementById('property-assignee');
                if (selectEl) selectEl.disabled = true;
            }
        }

        window.onload = initPage;
    </script>
</body>
